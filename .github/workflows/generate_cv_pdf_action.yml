name: Build CV PDF (EN only)

on:
  push:
    paths:
      - 'cv.md'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Pandoc and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Generate English CV PDF
        run: pandoc cv.md -o Fukui_CV_EN.pdf

      - name: Commit and Push PDF file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Fukui_CV_EN.pdf
          git commit -m "Auto-generate English CV PDF"
          git push
