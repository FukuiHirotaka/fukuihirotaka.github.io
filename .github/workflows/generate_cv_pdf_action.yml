name: Build CV PDF (EN only - HTML to PDF)

on:
  push:
    paths:
      - 'cv.md'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Pandoc and wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Convert Markdown to HTML
        run: pandoc cv.md -o cv.html

      - name: Convert HTML to PDF using wkhtmltopdf
        run: wkhtmltopdf cv.html Fukui_CV_EN.pdf

      - name: Commit and Push PDF file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Fukui_CV_EN.pdf
          git commit -m "Auto-generate English CV PDF (via HTML)"
          git push

