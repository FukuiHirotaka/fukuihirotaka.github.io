<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アセモグル風イントロ作成完全マニュアル</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { max-width: 800px; margin: auto; padding: 2em; font-family: sans-serif; }
    nav { margin-bottom: 2em; }
    nav button { margin-right: 10px; }
  </style>
</head>
<body>
  <h1>アセモグル風イントロ作成完全マニュアル</h1>
  <p>D1の1年を費やしてアセモグルの論文を解析し、作成した「アセモグル風イントロ」の構成法です。</p>
  <nav>
    <button onclick="loadMarkdown('1')">アセモグル風イントロの構成</button>
    <button onclick="loadMarkdown('2')">Big Picture</button>
    <button onclick="loadMarkdown('3')">Key Attribute</button>
    <button onclick="loadMarkdown('4')">Motivation</button>
    <button onclick="loadMarkdown('5')">Key Results</button>
    <button onclick="loadMarkdown('6')">Literature Review</button>
    <button onclick="loadMarkdown('7')">Roadmap</button>
  </nav>

  <div id="content">読み込み中...</div>

  <script>
    function loadMarkdown(chapter) {
      fetch(`acemoglu/ac${chapter}.md`)
        .then(res => res.text())
        .then(text => {
          document.getElementById('content').innerHTML = marked.parse(text);
        });
    }
    loadMarkdown('1'); // デフォルトで第1章
  </script>
</body>
</html>
