name: Build CV PDF
on:
  push:
    branches: [ main ]
    paths:
      - "cv.tex"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true   # 日本語が入るなら推奨
      - name: Copy PDF to site root
        run: cp cv.pdf Hirotaka_Fukui_academic_cv.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update CV PDF"
          file_pattern: Hirotaka_Fukui_academic_cv.pdf
