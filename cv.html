<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV | Hirotaka Fukui</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    #cv-content { margin-top: 2rem; }
    .language-switch { text-align: right; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container header-flex">
      <div class="logo-title">
        <img src="logo.jpg" alt="Logo" class="logo">
        <span class="site-title">Hirotaka Fukui</span>
      </div>
     <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="cv.html">CV</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
        </nav>
    </div>
  </header>

  <main class="container">
    <div class="language-switch">
      <a href="cvja.html">Japanese version</a>
    </div>
    <p><a href="cv.pdf" download>Download PDF (English)</a></p>
    <div id="cv-content">Loading CV...</div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Hirotaka Fukui. All rights reserved.</p>
    </div>
  </footer>

  <script>
    fetch('cv.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('cv-content').innerHTML = marked.parse(text);
      });
  </script>
</body>
</html>
