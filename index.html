    <figure style="margin: 2em auto; max-width: 700px; font-family: 'Merriweather', serif; color: #2c3e50;">
  <blockquote style="border-left: 5px solid #007acc; padding-left: 1.2em; font-style: italic; font-size: 1.15rem; line-height: 1.7;">
    “<p>The study of economics does not seem to require any specialised gifts of an unusually high order. 
        Is it not, intellectually regarded, a very easy subject compared with the higher branches of philosophy and pure science? 
        Yet good, or even competent, economists are the rarest of birds. 
        An easy subject, at which very few excel! 
        The paradox finds its explanation, perhaps, in that the master-economist must possess a rare combination of gifts. 
        He must reach a high standard in several different directions and must combine talents not often found together. 
        He must be mathematician, historian, statesman, philosopher&mdash;in some degree. 
        He must understand symbols and speak in words. He must contemplate the particular in terms of the general, and touch abstract and concrete in the same flight of thought. 
        He must study the present in the light of the past for the purposes of the future. No part of man's nature or his institutions must lie entirely outside his regard. 
        He must be purposeful and disinterested in a simultaneous mood; 
        as aloof and incorruptible as an artist, yet sometimes as near the earth as a politician.</p>”
  </blockquote>
  <figcaption style="margin-top: 0.8em; font-size: 0.95rem; text-align: right;">
    — <strong>John Maynard Keynes</strong>, <em>“Alfred Marshall, 1842–1924.”</em> 
    <a href="https://doi.org/10.2307/2222645" target="_blank" style="color:#007acc; text-decoration:none;">The Economic Journal (1924)</a>
  </figcaption>
</figure>
